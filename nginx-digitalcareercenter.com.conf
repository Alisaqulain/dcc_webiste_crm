# Complete Nginx Configuration for digitalcareercenter.com
# Location: /etc/nginx/sites-available/digitalcareercenter.com
#
# To view current config on server:
# sudo cat /etc/nginx/sites-available/digitalcareercenter.com
#
# To backup current config:
# sudo cp /etc/nginx/sites-available/digitalcareercenter.com /etc/nginx/sites-available/digitalcareercenter.com.backup

# HTTP Server Block (redirects to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name digitalcareercenter.com www.digitalcareercenter.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalcareercenter.com www.digitalcareercenter.com;

    # SSL Certificate Configuration
    # Update these paths to match your actual certificate locations
    ssl_certificate /etc/letsencrypt/live/digitalcareercenter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalcareercenter.com/privkey.pem;
    
    # SSL Configuration (recommended settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Root directory (if needed for static files)
    root /root/dcc_webiste_crm/public;
    index index.html index.htm;

    # Logging
    access_log /var/log/nginx/digitalcareercenter.com.access.log;
    error_log /var/log/nginx/digitalcareercenter.com.error.log;

    # ✅ CRITICAL: /uploads location block MUST come BEFORE location /
    # This serves uploaded images directly from the filesystem
    location /uploads {
        alias /root/dcc_webiste_crm/public/uploads;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        
        # Security: Only allow GET requests
        limit_except GET {
            deny all;
        }
        
        # Ensure correct MIME types for images
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }
        
        # Disable directory listing
        autoindex off;
    }

    # ✅ Main location block - proxies all other requests to Next.js
    # This MUST come AFTER /uploads location block
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: Serve other static files directly (if needed)
    # location /static {
    #     alias /root/dcc_webiste_crm/public/static;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # Optional: Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Optional: Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

